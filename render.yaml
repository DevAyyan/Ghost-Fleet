# Render Blueprint for the Ghost Fleet X API. An always-on alternative to running the API on Vercel.
# Docs: https://render.com/docs/blueprint-spec
#
# On the free plan the disk is wiped on every deploy and restart, so the cache (backend/data/raw) refills on first use.

services:
  - type: web
    name: ghost-fleet
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: "pip install -e '.[api]'"
    startCommand: "python3 -m uvicorn ghostfleet.api.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GHOSTFLEET_DATA
        value: real
      - key: GLOBAL_FISHING_WATCH
        sync: false # set in the Render dashboard; never commit it
