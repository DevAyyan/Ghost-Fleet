# Render Blueprint for the Ghost Fleet X API (the frontend is hosted on Vercel: see frontend/vercel.json).
# Docs: https://render.com/docs/blueprint-spec
#
# The API runs from the repo root because it reads data/processed/ and caches under data/raw/.
# On the free plan the disk is wiped on every deploy and restart, so the cache refills on first use.

services:
  - type: web
    name: ghost-fleet
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "pip install -e './backend[api]'"
    startCommand: "python3 -m uvicorn ghostfleet.api.main:app --app-dir backend --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/meta
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GHOSTFLEET_DATA
        value: real
      - key: GLOBAL_FISHING_WATCH
        sync: false # set in the Render dashboard; never commit it
