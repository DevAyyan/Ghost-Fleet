# Render Blueprint Specification for Ghost Fleet X
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ghost-fleet
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "cd frontend && npm install && npm run build && cd .. && pip install -e './backend[api]'"
    startCommand: "python3 -m uvicorn ghostfleet.api.main:app --app-dir backend --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GHOSTFLEET_DATA
        value: real
      - key: GLOBAL_FISHING_WATCH
        sync: false # Set securely in Render dashboard
