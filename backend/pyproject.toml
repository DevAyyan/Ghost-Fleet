[project]
name = "ghostfleet"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# Ingestion/API layer (install when network allows): uv pip install -e ".[data,api,dev]"
data = ["pandas>=2.2", "xarray>=2024.1", "netCDF4>=1.6", "h3>=4.1", "pyarrow>=15"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
